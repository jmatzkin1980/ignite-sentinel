<head><meta charset="utf-8"><title>Prototipo: aprobación de altas</title>

<body>

</section>
<section class="pantalla" id="detalle">
  <h1>Detalle del alta</h1>

</section>

  <h1>Delegar aprobaciones</h1>
  <p>La jefa de Compras elige un reemplazo que aprueba en su nombre durante sus vacaciones.</p>
</section>
