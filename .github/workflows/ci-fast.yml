# IMP-246 — fast tier: every push. Target: under 5 minutes.
# Unit suite without the slow modules (tests/slow_modules.txt), /doctor, the
# faithfulness eval and the static packaging test (part of the unit suite).
name: ci-fast

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTINEL_EVAL_REPORTS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (no optional extras)
        run: python -m pip install -e .
      - name: Unit suite (fast tier)
        run: python tools/run_tests.py --tier fast
      - name: Doctor
        run: python -m sentinel doctor
      - name: Faithfulness eval
        run: python tests/evals/run_faithfulness_claim_evals.py
