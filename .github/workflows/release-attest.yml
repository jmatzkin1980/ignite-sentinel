# IMP-289 — release artifacts with provenance, on every v* tag.
# Builds the wheel, the CycloneDX SBOM (tools/sbom.py) and signs a build
# provenance attestation for both (actions/attest-build-provenance, verifiable
# with `gh attestation verify <file> --repo jmatzkin1980/ignite-sentinel`).
# Creating the GitHub release and versioning belong to IMP-282; this workflow
# only uploads to a release that already exists for the tag.
name: release-attest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # gh release upload (only when the release exists)
      id-token: write       # OIDC token for the Sigstore signature
      attestations: write   # store the attestation
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Extras locks are hash-pinned
        run: python tools/check_constraints.py
      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: SBOM (CycloneDX)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python tools/sbom.py -o "dist/ignite-sentinel-${GITHUB_REF_NAME}.cdx.json"

      # TODO(IMP-279/IMP-282) hook point: build the Claude Code plugin .zip here,
      # run `claude plugin validate --strict` on it, and add `dist/*.zip` to the
      # attestation subject-path below. Not done in IMP-289 on purpose.

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/
      - name: Attach to the GitHub release (if IMP-282 already created it)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.cdx.json --clobber
          else
            echo "No release for $GITHUB_REF_NAME yet; artifacts kept on the run (release mechanics: IMP-282)."
          fi
